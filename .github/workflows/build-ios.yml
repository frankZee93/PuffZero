name: Build iOS

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build-ios:
    name: Build unsigned iOS .ipa
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-iOS-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-
            Library-iOS-

      - name: Build Unity project for iOS (exports Xcode project)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: auto
          allowDirtyBuild: true
          buildOptions: AcceptExternalModificationsToPlayer

      - name: Inspect build output
        run: |
          echo "=== Contents of build/ ==="
          ls -la build/ || true
          echo "=== Looking for .xcodeproj ==="
          find build -name "*.xcodeproj" -maxdepth 4 || true

      - name: Package unsigned .ipa
        run: |
          set -e

          XCPROJ_PATH=$(find build -name "*.xcodeproj" -maxdepth 4 | head -n 1)
          if [ -z "$XCPROJ_PATH" ]; then
            echo "ERROR: No .xcodeproj found under build/"
            exit 1
          fi
          echo "Found Xcode project: $XCPROJ_PATH"

          XCODE_DIR=$(dirname "$XCPROJ_PATH")
          cd "$XCODE_DIR"

          XCPROJ=$(basename "$XCPROJ_PATH")
          echo "Working directory: $PWD"
          echo "Xcode project file: $XCPROJ"

          SCHEME=$(xcodebuild -list -project "$XCPROJ" 2>/dev/null | awk '/Schemes:/{flag=1; next} flag && NF {print $1; exit}')
          if [ -z "$SCHEME" ]; then
            SCHEME="Unity-iPhone"
          fi
          echo "Using scheme: $SCHEME"

          # Archive unsigned
          xcodebuild \
            -project "$XCPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/App.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            | tail -n 100

          # --- FIX: search for the .app anywhere in the archive ---
          echo "=== Searching for .app inside the archive ==="
          find App.xcarchive -name "*.app" -maxdepth 6 || true

          APP_PATH=$(find App.xcarchive -name "*.app" -maxdepth 6 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found anywhere in App.xcarchive"
            echo "=== Full archive tree ==="
            find App.xcarchive -maxdepth 6
            exit 1
          fi
          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r PuffZero-iOS-unsigned.ipa Payload
          ls -la PuffZero-iOS-unsigned.ipa

          mkdir -p /tmp/ipa-output
          cp PuffZero-iOS-unsigned.ipa /tmp/ipa-output/

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: PuffZero-iOS-unsigned
          path: /tmp/ipa-output/PuffZero-iOS-unsigned.ipa
          if-no-files-found: error