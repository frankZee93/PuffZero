name: Build iOS

on:
  workflow_dispatch: {}

jobs:
  build-ios:
    name: Build unsigned iOS .ipa
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-iOS-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-
            Library-iOS-

      - name: Build Unity project for iOS (exports Xcode project)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: auto
          allowDirtyBuild: true
          buildOptions: AcceptExternalModificationsToPlayer

      - name: Inspect build output
        run: |
          echo "=== Looking for .xcodeproj ==="
          find build -name "*.xcodeproj" -maxdepth 4 || true

      - name: Build iOS app (.app)
        run: |
          set -e

          XCPROJ_PATH=$(find build -name "*.xcodeproj" -maxdepth 4 | head -n 1)
          if [ -z "$XCPROJ_PATH" ]; then
            echo "ERROR: No .xcodeproj found under build/"
            exit 1
          fi
          echo "Found Xcode project: $XCPROJ_PATH"

          XCODE_DIR=$(dirname "$XCPROJ_PATH")
          cd "$XCODE_DIR"

          XCPROJ=$(basename "$XCPROJ_PATH")
          echo "Working directory: $PWD"
          echo "Xcode project file: $XCPROJ"

          # Print what Xcode knows about this project
          echo "=== Schemes and targets ==="
          xcodebuild -list -project "$XCPROJ" || true

          # Explicitly use the Unity-iPhone scheme (NOT GameAssembly)
          SCHEME="Unity-iPhone"
          echo "Using scheme: $SCHEME"

          # Build the .app directly into a known output folder.
          OUTPUT_DIR="$PWD/build-output"
          mkdir -p "$OUTPUT_DIR"

          xcodebuild \
            -project "$XCPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$OUTPUT_DIR" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            SKIP_INSTALL=NO \
            INSTALL_PATH=/Applications \
            build \
            | tail -n 100

          echo "=== Contents of output dir ==="
          ls -la "$OUTPUT_DIR"

          APP_PATH=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.app" | head -n 1)

          # Fallback: search DerivedData if not in OUTPUT_DIR
          if [ -z "$APP_PATH" ]; then
            echo "Not found in OUTPUT_DIR. Searching DerivedData..."
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*Release-iphoneos*" -maxdepth 6 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found anywhere"
            echo "=== Searching whole workspace for .app ==="
            find . -name "*.app" -maxdepth 8 2>/dev/null || true
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r PuffZero-iOS-unsigned.ipa Payload
          ls -la PuffZero-iOS-unsigned.ipa

          mkdir -p /tmp/ipa-output
          cp PuffZero-iOS-unsigned.ipa /tmp/ipa-output/

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: PuffZero-iOS-unsigned
          path: /tmp/ipa-output/PuffZero-iOS-unsigned.ipa
          if-no-files-found: error